name: Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'tests/fixtures/async-*-template/**'
      - 'scripts/check-doc-examples.sh'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'tests/fixtures/async-*-template/**'
      - 'scripts/check-doc-examples.sh'
      - '.github/workflows/docs.yml'

jobs:
  check-doc-examples:
    name: Verify doc examples match fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check doc examples are in sync
        run: scripts/check-doc-examples.sh

  link-check:
    name: Check markdown links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress 'docs/**/*.md' 'README.md'
          fail: true
