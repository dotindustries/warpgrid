apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: openclaw

resources:
  - namespace.yaml
  - network-policy.yaml

# Agent configuration is mounted into the OpenClaw pod via the Helm chart's
# configMode: merge. The SOUL.md, AGENTS.md, and HEARTBEAT.md files under
# agents/marketeer/ are copied into the PVC during initial setup.
#
# To apply base manifests independently of Helm:
#   kubectl apply -k infra/openclaw/

commonLabels:
  app.kubernetes.io/part-of: warpgrid-marketing
  app.kubernetes.io/managed-by: kustomize
