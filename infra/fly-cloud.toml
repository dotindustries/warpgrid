# Fly.io config for the WarpGrid cloud control plane.
#
# Deploy:
#   fly deploy --config infra/fly-cloud.toml --dockerfile infra/Dockerfile

app = "warpgrid-cloud"
primary_region = "iad"

[build]
  dockerfile = "infra/Dockerfile"

[env]
  RUST_LOG = "info,warpd=debug,warpgrid=debug"
  WARPGRID_REGISTRY_BUCKET = "warpgrid-registry"

[http_service]
  internal_port = 8443
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    hard_limit = 250
    soft_limit = 200

[[vm]]
  size = "shared-cpu-2x"
  memory = "1gb"
  cpus = 2

[processes]
  app = "warpd cloud --api-port 8443 --data-dir /var/lib/warpgrid"
