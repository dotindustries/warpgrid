# Fly.io config template for ephemeral PR preview environments.
#
# Each PR gets its own app: warpgrid-pr-<number>
# Smaller VM than production, auto-stop enabled to minimize cost.
#
# Deploy (from CI):
#   fly deploy --config infra/fly-pr-preview.toml --dockerfile infra/Dockerfile \
#     --app warpgrid-pr-${PR_NUMBER}

app = "warpgrid-pr-0"        # placeholder — overridden by --app flag in CI
primary_region = "iad"

[env]
  RUST_LOG = "info,warpd=debug,warpgrid=debug"

[http_service]
  internal_port = 8443
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    hard_limit = 50
    soft_limit = 25

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpus = 1
