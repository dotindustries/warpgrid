# Fly.io config template for WarpGrid edge agent nodes.
#
# Each edge region gets one machine provisioned via the Fly Machines API.
# This template is used by the provisioner — not deployed directly.
#
# The provisioner creates machines with these settings programmatically.

app = "warpgrid-edge"

[env]
  RUST_LOG = "info,warpd=debug"

[http_service]
  internal_port = 8443
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    hard_limit = 500
    soft_limit = 400

[[vm]]
  size = "shared-cpu-2x"
  memory = "1gb"
  cpus = 2

[processes]
  app = "warpd agent --control-plane ${WARPGRID_CONTROL_PLANE} --port 8443"
